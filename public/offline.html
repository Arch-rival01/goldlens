<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | GoldLens</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0F172A;
      color: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #111B2E;
      border: 1px solid #26364F;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      color: #60A5FA;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.75rem; font-weight: 700; color: #fff; }
    p { font-size: 1.05rem; line-height: 1.6; color: #9ca3af; margin-bottom: 2rem; }
    button {
      background: #2563EB;
      color: #FFFFFF;
      border: none;
      padding: 0.75rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1D4ED8; color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
    </svg>
    <h1>You're Offline</h1>
    <p>GoldLens requires an internet connection for live or refreshed analytical data. Previously loaded snapshots remain accessible once reconnected.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
